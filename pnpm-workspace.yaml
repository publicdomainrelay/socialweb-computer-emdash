packages:
  - site
  - plugins/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  better-sqlite3: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

patchedDependencies:
  "@emdash-cms/auth-atproto@0.2.50": patches/@emdash-cms__auth-atproto@0.2.50.patch
