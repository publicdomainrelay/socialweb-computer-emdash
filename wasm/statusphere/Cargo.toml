[package]
name = "statusphere"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
atproto-record = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "c4564e941675d2566c65ecf26b9698aae5229768" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
